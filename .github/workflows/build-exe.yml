name: Build Windows EXE (portable ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: |
          pyinstaller `
            --onedir `
            --windowed `
            --name "DreamDexed-Studio" `
            --icon=harvester/icon.ico `
            --add-data "harvester;harvester" `
            --add-data "DX7 Cartridges;DX7 Cartridges" `
            Main.py

      - name: Debug - list dist content
        run: dir dist\DreamDexed-Studio

      - name: Zip the portable folder (flat layout)
        shell: pwsh
        run: |
          $source = "dist\DreamDexed-Studio"
          $dest   = "dist\DreamDexed-Studio.zip"
          Compress-Archive -Path "$source\DreamDexed-Studio.exe", "$source\harvester", "$source\DX7 Cartridges" -DestinationPath $dest -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamDexed-Studio
          path: dist/DreamDexed-Studio.zip

      - name: Create Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DreamDexed-Studio.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}