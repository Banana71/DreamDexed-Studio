name: Build Windows EXE (portable ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        shell: cmd
        run: |
          pyinstaller ^
            --onedir ^
            --windowed ^
            --name "DreamDexed-Studio" ^
            --icon=harvester/icon.ico ^
            --add-data "harvester;harvester" ^
            --add-data "DX7 Cartridges;DX7 Cartridges" ^
            Main.py

      # ----- Ordner aus _internal neben die EXE VERSCHIEBEN -----
      - name: Move data folders next to EXE
        shell: pwsh
        run: |
          $base = "dist\DreamDexed-Studio"
          foreach ($folder in @("harvester", "DX7 Cartridges")) {
            $src = Join-Path $base "_internal\$folder"
            $dst = Join-Path $base $folder
            if (Test-Path $src) {
              Move-Item -Path $src -Destination $dst -Force
              Write-Host "Moved $folder to $dst"
            } else {
              Write-Host "WARNING: $src not found – folder may be missing in build"
            }
          }

      - name: Debug - list dist content (after move)
        run: dir dist\DreamDexed-Studio

      - name: Zip the complete portable folder
        shell: pwsh
        run: |
          $source = "dist\DreamDexed-Studio"
          $dest   = "dist\DreamDexed-Studio.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $dest -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamDexed-Studio
          path: dist/DreamDexed-Studio.zip

      - name: Create Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DreamDexed-Studio.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}