name: Build Windows EXE (portable ZIP)

on:
  push:
    branches:
      - main
    paths:
      - 'harvester/about_dialog.py' # Trigger, wenn die Version im Code geändert wird
  workflow_dispatch: # Erlaubt weiterhin manuelles Starten

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig, um bestehende Tags für den Vergleich zu prüfen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- AUTOMATISCHE VERSIONSERMITTLUNG & TAG-ERSTELLUNG ----------
      - name: Extract version and check tag
        shell: pwsh
        id: version_check
        run: |
          # Extrahiere die Versionsnummer aus der about_dialog.py
          $versionLine = Get-Content "harvester/about_dialog.py" | Select-String -Pattern '^VERSION\s*=\s*'
          if ($versionLine -match '"([^"]+)"') {
              $version = $Matches[1]
          } else {
              Write-Error "VERSION konnte in harvester/about_dialog.py nicht gefunden werden!"
              exit 1
          }
          
          $tag = "v$version"
          Write-Host "Gefundene Software-Version: $version"
          Write-Host "Ziel-Tag: $tag"
          
          # Prüfen, ob der Tag bereits im Repository existiert
          $tagExists = git tag -l $tag
          if ($tagExists) {
              Write-Host "Tag $tag existiert bereits."
              # Wenn manuell gestartet oder Tag existiert, setzen wir skip_release auf true
              echo "SKIP_RELEASE=true" >> $env:GITHUB_ENV
              echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          } else {
              Write-Host "Neuer Tag erkannt. Erstelle Tag $tag..."
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git tag $tag
              git push origin $tag
              echo "SKIP_RELEASE=false" >> $env:GITHUB_ENV
              echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        shell: cmd
        run: |
          pyinstaller ^
            --onedir ^
            --windowed ^
            --name "DreamDexed-Studio" ^
            --icon=harvester/icon.ico ^
            --add-data "harvester;harvester" ^
            --add-data "DX7 Cartridges;DX7 Cartridges" ^
            Main.py

      # Schließe about_dialog.py explizit ein, falls PyInstaller sie nicht automatisch erfasst
      - name: Move data folders next to EXE
        shell: pwsh
        run: |
          $base = "dist\DreamDexed-Studio"
          foreach ($folder in @("harvester", "DX7 Cartridges")) {
            $src = Join-Path $base "_internal\$folder"
            $dst = Join-Path $base $folder
            if (Test-Path $src) {
              Move-Item -Path $src -Destination $dst -Force
              Write-Host "Moved $folder to $dst"
            } else {
              Write-Host "WARNING: $src not found"
            }
          }

      - name: Remove Python source files from harvester (keep assets)
        shell: pwsh
        run: |
          $target = "dist\DreamDexed-Studio\harvester"
          Get-ChildItem -Path $target -Include "*.py", "*.pyc" -Recurse | Remove-Item -Force
          Write-Host "Cleaned harvester folder"

      - name: Copy midi_button_config.json to base folder
        shell: pwsh
        run: |
          $dest = "dist\DreamDexed-Studio\midi_button_config.json"
          if (Test-Path "midi_button_config.json") {
            Copy-Item "midi_button_config.json" $dest -Force
            Write-Host "Copied existing midi_button_config.json"
          } else {
            '{}' | Out-File -FilePath $dest -Encoding utf8
            Write-Host "Created default midi_button_config.json"
          }

      - name: Zip the portable folder
        shell: pwsh
        run: |
          $source = "dist\DreamDexed-Studio"
          $dest   = "dist\DreamDexed-Studio.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $dest -Force
          Write-Host "Created $dest"

      - name: Upload artifact (entire folder)
        uses: actions/upload-artifact@v4
        with:
          name: DreamDexed-Studio
          path: dist\DreamDexed-Studio

      # ---------- AUTOMATISCHER RELEASE-SCHRITT ----------
      - name: Create Release (only on new version)
        if: env.SKIP_RELEASE == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/DreamDexed-Studio.zip
          draft: false  # Direkt als finaler Release veröffentlichen
          generate_release_notes: true # GitHub generiert die Commit-Liste automatisch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}