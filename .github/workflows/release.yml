name: Build and Release Portable Windows App

on:
  push:
    branches:
      - main
    paths:
      - 'harvester/about_dialog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version and check tag
        shell: pwsh
        id: version_check
        run: |
          $versionLine = Get-Content "harvester/about_dialog.py" | Select-String -Pattern '^VERSION\s*=\s*'
          if ($versionLine -match '"([^"]+)"') {
              $version = $Matches[1]
          } else {
              Write-Error "VERSION could not be found in harvester/about_dialog.py!"
              exit 1
          }
          
          $tag = "v$version"
          Write-Host "Found software version: $version"
          Write-Host "Target tag: $tag"
          
          $tagExists = git tag -l $tag
          if ($tagExists) {
              Write-Host "Tag $tag already exists."
              echo "SKIP_RELEASE=true" >> $env:GITHUB_ENV
              echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          } else {
              Write-Host "New tag detected. Creating tag $tag..."
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git tag $tag
              git push origin $tag
              echo "SKIP_RELEASE=false" >> $env:GITHUB_ENV
              echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pip install markdown

      - name: Build with PyInstaller (onedir)
        shell: cmd
        run: |
          pyinstaller ^
            --onedir ^
            --windowed ^
            --name "DreamDexed-Studio" ^
            --icon=harvester/icon.ico ^
            --add-data "harvester;harvester" ^
            --add-data "DX7 Cartridges;DX7 Cartridges" ^
            Main.py

      - name: Move data folders next to EXE
        shell: pwsh
        run: |
          $base = "dist\DreamDexed-Studio"
          foreach ($folder in @("harvester", "DX7 Cartridges")) {
            $src = Join-Path $base "_internal\$folder"
            $dst = Join-Path $base $folder
            if (Test-Path $src) {
              Move-Item -Path $src -Destination $dst -Force
              Write-Host "Moved $folder to $dst"
            } else {
              Write-Host "WARNING: $src not found"
            }
          }

      - name: Remove Python source files from harvester (keep assets)
        shell: pwsh
        run: |
          $target = "dist\DreamDexed-Studio\harvester"
          Get-ChildItem -Path $target -Include "*.py", "*.pyc" -Recurse | Remove-Item -Force
          Write-Host "Cleaned harvester folder"

      - name: Copy midi_button_config.json to base folder
        shell: pwsh
        run: |
          $dest = "dist\DreamDexed-Studio\midi_button_config.json"
          if (Test-Path "midi_button_config.json") {
            Copy-Item "midi_button_config.json" $dest -Force
            Write-Host "Copied existing midi_button_config.json"
          } else {
            '{}' | Out-File -FilePath $dest -Encoding utf8
            Write-Host "Created default midi_button_config.json"
          }

      - name: Convert MANUAL.md to PDF via Chrome
        shell: pwsh
        run: |
          $exeDir = "dist\DreamDexed-Studio"
          
          # 1. MD in HTML umwandeln via Standard-Python-Markdown
          python -c '
          import markdown
          with open("MANUAL.md", "r", encoding="utf-8") as f:
              text = f.read()
          html_content = markdown.markdown(text, extensions=["extra"])
          
          # Einbetten von CSS für ein schönes Layout und Seitenzahlen beim Drucken
          full_html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <style>
              body {{ font-family: sans-serif; line-height: 1.6; padding: 20px; }}
              img {{ max-width: 100%; height: auto; display: block; margin: 20px 0; }}
              @page {{
                  size: A4;
                  margin: 2cm;
                  @bottom-right {{
                      content: counter(page);
                  }}
              }}
          </style>
          </head>
          <body>
          {{html_content}}
          </body>
          </html>"""
          
          with open("MANUAL.html", "w", encoding="utf-8") as f:
              f.write(full_html)
          '
          
          # 2. Chrome im Headless-Modus starten und das HTML als PDF drucken
          & "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless --disable-gpu --print-to-pdf="$exeDir\MANUAL.pdf" MANUAL.html
          
          # Aufräumen
          Remove-Item "MANUAL.html" -Force
          Write-Host "MANUAL.pdf erfolgreich via Chrome gedruckt."

      - name: Zip the portable folder
        shell: pwsh
        run: |
          $source = "dist\DreamDexed-Studio"
          $dest   = "dist\DreamDexed-Studio ${{ env.RELEASE_TAG }}.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $dest -Force
          Write-Host "Created $dest"

      - name: Upload artifact (entire folder)
        uses: actions/upload-artifact@v4
        with:
          name: DreamDexed-Studio
          path: dist\DreamDexed-Studio

      - name: Create Release (only on new version)
        if: env.SKIP_RELEASE == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/DreamDexed-Studio ${{ env.RELEASE_TAG }}.zip
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}